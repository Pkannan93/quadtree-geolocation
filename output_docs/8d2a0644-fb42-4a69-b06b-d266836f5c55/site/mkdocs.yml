site_name: 'Geospatial indexing and visualization using quadtrees (geolocation optimization / efficient spatial queries) Documentation'
site_description: 'Generated by code-analyser-documentation (R2 F5).'
repo_url: 'https://github.com/Pkannan93/quadtree-geolocation.git'

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
    - scheme: slate
      primary: indigo

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Modules: modules/index.md
  - Quality:
      - Overview: quality.md
      - Test coverage: quality/test-coverage.md
      - Doc coverage: quality/doc-coverage.md
      - Per-module bands: quality/per-module.md
  - Code Health:
      - Overview: code-health/index.md
      - Markers: code-health/markers.md
      - Deprecated: code-health/deprecated.md
      - Dead code: code-health/dead-code.md
      - Hotspots: code-health/hotspots.md
      - Cycles: code-health/cycles.md
  - Security:
      - Overview: security/index.md
      - Auth summary: security/auth-summary.md
      - Route auth matrix: security/route-auth-matrix.md
      - Secrets & config: security/secrets-config.md
  - Concepts:
      - Overview: concepts/index.md
      - Bounded contexts: concepts/contexts.md
      - Actors: concepts/actors.md
      - Capability matrix: concepts/capability-matrix.md
      - Glossary: concepts/terms.md
      - Data model (narrative): concepts/data-model.md
  - Operations:
      - Overview: operations/index.md
      - Environment variables: operations/environments.md
      - Healthchecks: operations/healthchecks.md
      - Background jobs: operations/jobs.md
      - Topology: operations/topology.md
      - Procedures: operations/procedures.md
  - Configuration:
      - Overview: configuration/index.md
      - Environment: configuration/environment.md
      - Feature flags: configuration/feature-flags.md
      - CLI: configuration/cli.md
  - Design:
      - HLD:
          - Overview: hld/index.md
          - System context: hld/system-context.md
          - Components: hld/components.md
          - Architecture: hld/architecture.md
          - Data flows: hld/data-flows.md
          - Integration: hld/integration.md
          - Deployment: hld/deployment.md
      - LLD:
          - Overview: lld/index.md
          - Modules:
              - quadtree/graphic: lld/modules/quadtree__graphic.md
              - quadtree/graphic/gradle/wrapper: lld/modules/quadtree__graphic__gradle__wrapper.md
              - quadtree/graphic/src/main/java/src: lld/modules/quadtree__graphic__src__main__java__src.md
              - quadtree/graphic/src/main/java/src/quadtree: lld/modules/quadtree__graphic__src__main__java__src__quadtree.md
              - quadtree/graphic/src/main/java/src/quadtree/core: lld/modules/quadtree__graphic__src__main__java__src__quadtree__core.md
              - root: lld/modules/root.md
